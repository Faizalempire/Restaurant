{% extends "base.html" %}
{% load static %}

{% block title %}Map - {{ hotel.name }}{% endblock %}

{% block content %}

<h1>Location - {{ hotel.name }}</h1>

<iframe 
    width="100%" 
    height="400" 
    style="border:0" 
    loading="lazy"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
    src="https://www.google.com/maps?q={{ hotel.location }}&output=embed">
</iframe>

{% endblock %}
