{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h1 class="login-title">🍴 Gourmet Tables</h1>
        <p class="login-subtitle">Owner Portal</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="login-form">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="register-link">New here? <a href="{% url 'hotels:owner_register' %}">Register as Owner</a></p>
    </div>
</div>

<style>
/* Full-page wrapper */
.login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(120deg, #f5f7fa, #c3cfe2);
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 50%, #6a11cb 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;

    position: relative;
    overflow: hidden;
}
.login-wrapper::before, .login-wrapper::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
    filter: blur(120px);
    z-index: 1;
}

.login-wrapper::before {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle at center, #ff4d4d, #b30000);
    top: -150px;
    left: -150px;
}

.login-wrapper::after {
    width: 700px;
    height: 700px;
    background: radial-gradient(circle at center, #28a745, #218838);
    bottom: -200px;
    right: -200px;
}

/* Animate background gradient */
@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}




/* Glassmorphism Card */
.login-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    padding: 50px 40px;
    border-radius: 25px;
    width: 100%;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    transition: transform 0.5s ease, box-shadow 0.5s ease;
}

.login-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
}

/* Title */
.login-title {
    font-size: 2.5rem;
    font-weight: 800;
    color: #ff4d4d;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.login-subtitle {
    font-size: 1.2rem;
    font-weight: 500;
    color: #555;
    margin-bottom: 30px;
}

/* Input Fields */
.input-group {
    margin-bottom: 20px;
}

.input-group input {
    width: 100%;
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.input-group input:focus {
    border-color: #ff4d4d;
    box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
    outline: none;
}

/* Login Button */
.btn-login {
    width: 100%;
    padding: 15px 0;
    border: none;
    border-radius: 15px;
    font-size: 1.1rem;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, #ff4d4d, #b30000);
    cursor: pointer;
    transition: all 0.4s ease;
}

.btn-login:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 20px rgba(255, 77, 77, 0.5);
}

/* Error Message */
.error {
    background: #ffe6e6;
    color: #b30000;
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 600;
}

/* Register Link */
.register-link {
    margin-top: 20px;
    font-size: 0.95rem;
}

.register-link a {
    color: #ff4d4d;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.register-link a:hover {
    color: #b30000;
}

/* Animations */
.login-card {
    animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
    0% {
        opacity: 0;
        transform: translateY(-30px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive */
@media (max-width: 500px) {
    .login-card {
        padding: 40px 20px;
    }
}
</style>
{% endblock %}
