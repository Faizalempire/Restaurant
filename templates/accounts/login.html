{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Login | Gourmet Tables</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1c1c1c, #2c2c2c);
            font-family: 'Poppins', sans-serif;
        }

        .login-box {
            background: #ffffff;
            width: 420px;
            padding: 45px 40px;
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            text-align: center;
        }

        .login-box h2 {
            font-family: 'Cinzel', serif;
            color: #b88b4a;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .login-box p {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 1rem;
            transition: 0.3s ease;
        }

        .login-box input:focus {
            outline: none;
            border-color: #b88b4a;
            box-shadow: 0 0 0 2px rgba(184,139,74,0.15);
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b88b4a, #8c6239);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184,139,74,0.4);
        }

        .error-message {
            background: #ffe6e6;
            color: #b30000;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }

        .register-link {
            margin-top: 22px;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #b88b4a;
            font-weight: 500;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Owner Login</h2>
        <p>Access your restaurant dashboard</p>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="register-link">
            Don’t have a restaurant?
            <a href="{% url 'hotels:owner_register' %}">Register here</a>
        </div>
    </div>

</body>
</html>
